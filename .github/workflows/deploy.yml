name: CI & Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petanque_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_CREDENTIALS: >-
        {"debug": true,
         "domains": ["localhost", "127.0.0.1"],
         "csrf_origins": ["http://localhost"],
         "country": "UA",
         "language": "uk",
         "db_name": "petanque_portal_test",
         "db_user": "postgres",
         "db_pass": "postgres",
         "db_host": "127.0.0.1",
         "db_port": "5432"}
    defaults:
      run:
        working-directory: components/web-api/application
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: components/web-api/application/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Django system checks
        run: python manage.py check

      - name: Verify migrations match models
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test --noinput

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo bash -c 'cd /root/app/portal && git pull && bash deploy/remote_run.sh'
