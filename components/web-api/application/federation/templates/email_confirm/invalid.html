{% extends "common/page_base.html" %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
        <section class="p-4 rounded shadow text-center">
            <h5 class="pb-2 border-bottom fw-bold">{% trans "Invalid link" %}</h5>
            <p class="mt-3">
                {% if error_message %}
                    {{ error_message }}
                {% else %}
                    {% trans "The link is invalid or expired." %}
                {% endif %}
            </p>
            <a class="btn btn-primary" href="{% url 'email_prompt' %}">{% trans "Send a new link" %}</a>
        </section>
    </div>
</div>
{% endblock %}
