{% load app_filters %}

<div class="col-lg-4">
    <div class="card">
        <div class="card-header fw-bold">Клуб</div>
        <div class="card-body">
            <div class="row align-items-start">
                {% if item %}
                    <div class="col-md-4 text-center">
                        {{ item|club_logo:"big"|safe }}
                    </div>

                    <dl class="row col-md-8">
                        <dt class="fw-bold col-sm-5">Назва</dt>
                        <dd class="col-sm-7">
                            <a href="{% url 'club' id=item.pk %}">{{ item.short_name }}</a>
                        </dd>
                        <dt class="fw-bold col-sm-5">Місто</dt>
                        <dd class="col-sm-7">{{ item.city }}</dd>
                        <dt class="fw-bold col-sm-5">Країна</dt> 
                        <dd class="col-sm-7">{{ item.city.country|country_icon|safe }}</dd>
                    </dl>
                {% else %}
                    <div class="text-center">
                        <span class="badge bg-danger p-2">Без клубу</span>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
