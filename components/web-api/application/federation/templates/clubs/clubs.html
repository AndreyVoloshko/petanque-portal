{% extends "common/page_base.html" %}
{% load app_filters %}
{% load i18n %}

{% block content %}
<section class="players-page clubs-page" aria-labelledby="clubs-page-title">
    <div class="players-titlebar">
        <div class="players-title-copy">
            <h1 id="clubs-page-title">
                {{ page_title }}
                <span class="players-title-icon" aria-hidden="true">
                    <i class="bi bi-buildings"></i>
                </span>
            </h1>
            <p>
                {% trans "Club rating by active athletes, points, and average results" %}
                <span class="players-page-info" data-bs-toggle="tooltip" data-bs-placement="top" title="{% trans "Club points are calculated from active licensed athletes. The table can be searched by club, city, or president and sorted by the most useful club indicators." %}">
                    <i class="bi bi-info-circle" aria-hidden="true"></i>
                </span>
            </p>
        </div>
    </div>

    <form class="players-control-panel clubs-filter-form" method="get" action="{{ request.path }}">
        {% if page_size != 25 %}
            <input type="hidden" name="per_page" value="{{ page_size }}">
        {% endif %}

        <div class="players-search-mount" aria-label="{% trans "Search clubs" %}">
            <label class="players-search-label">
                <i class="bi bi-search players-search-icon" aria-hidden="true"></i>
                <input class="players-search-input" type="search" name="q" value="{{ club_filters.search }}" placeholder="{% trans "Search by club, city, or president..." %}" aria-label="{% trans "Search by club, city, or president..." %}">
            </label>
        </div>

        <div class="players-filter-controls" aria-label="{% trans "Club filters" %}">
            <label class="players-filter-field">
                <i class="bi bi-geo-alt" aria-hidden="true"></i>
                <select class="players-filter-select" name="city" aria-label="{% trans "City" %}">
                    <option value="">{% trans "All cities" %}</option>
                    {% for city in club_filter_options.cities %}
                        <option value="{{ city }}" {% if club_filters.city == city %}selected{% endif %}>{{ city }}</option>
                    {% endfor %}
                </select>
            </label>

            <label class="players-filter-field">
                <i class="bi bi-calendar3" aria-hidden="true"></i>
                <select class="players-filter-select" name="year" aria-label="{% trans "Year founded" %}">
                    <option value="">{% trans "All founding years" %}</option>
                    {% for year in club_filter_options.years %}
                        <option value="{{ year }}" {% if club_filters.year == year %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>
            </label>

            <label class="players-filter-field">
                <i class="bi bi-sort-down" aria-hidden="true"></i>
                <select class="players-filter-select" name="sort" aria-label="{% trans "Sort clubs" %}">
                    {% for value,label in club_sort_options %}
                        <option value="{{ value }}" {% if club_filters.sort == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
        </div>
    </form>

    {% include "clubs/clubs_table.html" with items=clubs %}
</section>
{% endblock %}
