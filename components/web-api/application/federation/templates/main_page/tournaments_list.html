{% load app_filters %}
<div class="row g-3">
    <div class="col-lg-12">
        <ol class="list-group">
        {% for item in items %}
            <li class="list-group-item">
                <a href="{% url 'tournament' id=item.pk %}" class="text-decoration-none">
                    {{ item.name }}
                </a>
            </li>
        {% endfor %}
        </ol>
    </div>
</div>
