{% load i18n %}

{% if current_user.can_view_insurance_warnings and not player.has_valid_insurance %}
    {% trans "Insurance is missing or expired" as insurance_warning_text %}
    <span class="tournament-team-insurance-marker tournament-team-insurance-warning d-inline-flex align-items-center flex-shrink-0 ms-1" data-bs-toggle="tooltip" data-bs-placement="top" title="{{ insurance_warning_text }}" aria-label="{{ insurance_warning_text }}">
        <i class="bi bi-shield-exclamation lh-1" aria-hidden="true"></i>
    </span>
{% endif %}
