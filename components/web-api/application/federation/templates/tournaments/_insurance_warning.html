{% load i18n %}

{% if tournament.requires_insurance and not player.has_valid_insurance %}
    {% trans "Insurance is missing or expired" as insurance_warning_text %}
    <span class="tournament-team-insurance-warning badge rounded-pill bg-warning-subtle text-warning-emphasis border border-warning-subtle d-inline-flex align-items-center justify-content-center p-1 flex-shrink-0" data-bs-toggle="tooltip" data-bs-placement="top" title="{{ insurance_warning_text }}" aria-label="{{ insurance_warning_text }}">
        <i class="bi bi-exclamation-triangle-fill lh-1" aria-hidden="true"></i>
    </span>
{% endif %}
