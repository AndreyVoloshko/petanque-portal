{% if href %}<a class="btn d-inline-flex align-items-center justify-content-center portal-btn {{ css_class }}" href="{{ href }}" data-variant="{{ variant|default:'outline' }}">{% if icon %}<i class="bi {{ icon }}" aria-hidden="true"></i>{% endif %}{{ label }}</a>{% else %}<button class="btn d-inline-flex align-items-center justify-content-center portal-btn {{ css_class }}" type="submit" data-variant="{{ variant|default:'primary' }}">{{ label }}</button>{% endif %}
