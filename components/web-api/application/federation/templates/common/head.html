        <script>
            (function(window, document) {
                window.PetanquePortal = window.PetanquePortal || {};

                var tooltipSelector = '[data-bs-toggle="tooltip"], [data-toggle="tooltip"]';
                var touchQuery = window.matchMedia
                    ? window.matchMedia('(hover: none), (pointer: coarse)')
                    : null;
                var activeTooltipTrigger = null;

                function isTouchTooltipDevice() {
                    return touchQuery ? touchQuery.matches : false;
                }

                function isTouchTooltipEvent(event) {
                    return isTouchTooltipDevice() || event.pointerType === 'touch' || event.type === 'touchstart';
                }

                function getBootstrapTooltip(element) {
                    var Tooltip = window.bootstrap && window.bootstrap.Tooltip;

                    if (!Tooltip || !Tooltip.getInstance) {
                        return null;
                    }

                    return Tooltip.getInstance(element);
                }

                function isTooltipVisible(element) {
                    var tooltipId = element.getAttribute('aria-describedby');

                    return Boolean(tooltipId && document.getElementById(tooltipId));
                }

                function hideTooltip(element) {
                    var tooltip = getBootstrapTooltip(element);

                    if (tooltip && tooltip.hide) {
                        tooltip.hide();
                    }

                    if (element.blur) {
                        element.blur();
                    }
                }

                function hideAllTooltips(exceptElement) {
                    document.querySelectorAll(tooltipSelector).forEach(function(element) {
                        if (element !== exceptElement) {
                            hideTooltip(element);
                        }
                    });
                }

                function closestTooltipTrigger(target) {
                    if (!target.closest) {
                        return null;
                    }

                    return target.closest(tooltipSelector);
                }

                function handleTouchTooltipTap(event) {
                    var trigger;

                    if (!isTouchTooltipEvent(event)) {
                        return;
                    }

                    if (event.target.closest && event.target.closest('.tooltip')) {
                        return;
                    }

                    trigger = closestTooltipTrigger(event.target);

                    if (!trigger) {
                        hideAllTooltips();
                        activeTooltipTrigger = null;
                        return;
                    }

                    if (trigger.matches && trigger.matches('a[href]')) {
                        hideAllTooltips(trigger);
                        activeTooltipTrigger = trigger;
                        return;
                    }

                    if (isTooltipVisible(trigger)) {
                        event.preventDefault();

                        if (event.stopImmediatePropagation) {
                            event.stopImmediatePropagation();
                        }

                        hideTooltip(trigger);
                        activeTooltipTrigger = null;
                        return;
                    }

                    hideAllTooltips(trigger);
                    activeTooltipTrigger = trigger;
                }

                document.addEventListener('show.bs.tooltip', function(event) {
                    if (!isTouchTooltipDevice()) {
                        return;
                    }

                    hideAllTooltips(event.target);
                    activeTooltipTrigger = event.target;
                }, true);

                document.addEventListener('hidden.bs.tooltip', function(event) {
                    if (activeTooltipTrigger === event.target) {
                        activeTooltipTrigger = null;
                    }
                }, true);

                document.addEventListener(
                    window.PointerEvent ? 'pointerdown' : 'touchstart',
                    handleTouchTooltipTap,
                    true
                );

                window.PetanquePortal.tooltips = {
                    hideAll: hideAllTooltips
                };
            })(window, document);
        </script>

        <!-- DataTable data fixes -->
        <script>
            $(document).ready(function () {
                var fuzzyNum = function(x) {
                    return x.replace(/[^\d\.\-]/g,"");
                };

                jQuery.fn.dataTable.ext.order['numbercase-asc'] = function(x, y){
                    return fuzzyNum(x)- fuzzyNum(y);
                };

                jQuery.fn.dataTable.ext.order['numbercase-desc'] = function(x, y){
                    return fuzzyNum(y)- fuzzyNum(x);
                };

                jQuery('.force-follow-link').click(function(e) {
                    e.preventDefault();
                    window.location.href = jQuery(this).attr('href');
                });
            });

            (function(window, $) {
                if (!$) {
                    return;
                }

                window.PetanquePortal = window.PetanquePortal || {};

                var defaultLengthValues = [25, 50, 100, -1];

                function defaultPageLength() {
                    if (!window.matchMedia) {
                        return 50;
                    }

                    if (window.matchMedia('(max-width: 767.98px)').matches) {
                        return 25;
                    }

                    if (window.matchMedia('(max-width: 1199.98px)').matches) {
                        return 30;
                    }

                    return 50;
                }

                function footerOptions(options) {
                    var config = options || {};
                    var lengthLabel = config.lengthLabel || '';
                    var allLabel = config.allLabel || 'All';

                    return {
                        dom: 't<"d-none portal-datatable-generated-controls"lpi>',
                        pageLength: config.pageLength || defaultPageLength(),
                        pagingType: 'full_numbers',
                        lengthMenu: [
                            defaultLengthValues,
                            [25, 50, 100, allLabel]
                        ],
                        language: {
                            lengthMenu: '<span>' + lengthLabel + '</span> _MENU_',
                            paginate: {
                                first: '<i class="bi bi-chevron-double-left" aria-hidden="true"></i>',
                                previous: '<i class="bi bi-chevron-left" aria-hidden="true"></i>',
                                next: '<i class="bi bi-chevron-right" aria-hidden="true"></i>',
                                last: '<i class="bi bi-chevron-double-right" aria-hidden="true"></i>'
                            }
                        }
                    };
                }

                function mountFooter(tableElement, footerElement) {
                    var table = $(tableElement);
                    var footer = $(footerElement);
                    var wrapper = table.closest('.dataTables_wrapper');
                    var length = wrapper.find('.dataTables_length');
                    var info = wrapper.find('.dataTables_info');
                    var paginate = wrapper.find('.dataTables_paginate');
                    var infoMount = footer.find('.js-datatable-info-mount');
                    var paginationMount = footer.find('.js-datatable-pagination-mount');
                    var lengthMount = footer.find('.js-datatable-length-mount');

                    if (info.length && infoMount.length && info.parent()[0] !== infoMount[0]) {
                        infoMount.empty().append(info);
                    }

                    if (paginate.length && paginationMount.length && paginate.parent()[0] !== paginationMount[0]) {
                        paginationMount.empty().append(paginate);
                    }

                    if (length.length && lengthMount.length) {
                        length.addClass('players-page-size-form');
                        if (length.parent()[0] !== lengthMount[0]) {
                            lengthMount.empty().append(length);
                        }
                    }
                }

                window.PetanquePortal.dataTableFooter = {
                    defaultPageLength: defaultPageLength,
                    init: function(tableElement, tableOptions, footerElement, afterDraw) {
                        var table = $(tableElement);
                        var options = $.extend(true, {}, tableOptions || {});
                        var portalFooter = options.portalFooter || {};
                        delete options.portalFooter;

                        var dataTable = table.DataTable($.extend(true, {}, footerOptions(portalFooter), options));

                        mountFooter(table, footerElement);
                        dataTable.on('draw.dt', function() {
                            mountFooter(table, footerElement);
                            if (typeof afterDraw === 'function') {
                                afterDraw(dataTable);
                            }
                        });

                        return dataTable;
                    },
                    mount: mountFooter
                };
            })(window, window.jQuery);
        </script>
