{% load static i18n %}
<html data-bs-theme="light">
    <head>

        <title>{% trans "Portal | Ukrainian Petanque Federation" %}</title>

        <meta property="og:title" content="{% trans "Ukrainian Petanque Federation Portal" %}" />
        <meta property="og:type" content="website" />
        <meta property="og:description" content="{% trans "Petanque in Ukraine. Current information on competition results, athlete rankings, and the structure of the Ukrainian Petanque Federation." %}" />
        <meta property="og:image" content="http://petanque.org.ua/wp-content/uploads/2013/10/fpu-logo.png" />


        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="{% trans "Ukrainian Petanque Federation portal. Information about the federation, clubs, athletes, and competitions." %}">

        <!-- Favicons -->
        <link rel="shortcut icon" href="{% static 'favicon.ico' %}">
        <link rel="apple-touch-icon" href="{% static 'favicon.ico' %}">
        <link rel="apple-touch-icon" sizes="72x72" href="{% static 'favicon.ico' %}">
        <link rel="apple-touch-icon" sizes="114x114" href="{% static 'favicon.ico' %}">

        {% comment %} <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"> {% endcomment %}
        <link rel="stylesheet" href="{% static 'bootstrap-theme.css' %}" />

        <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/flag-icon-css/2.3.1/css/flag-icon.min.css" />

        <!-- Bootswatch Flatly Theme -->
        {% comment %} <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/zephyr/bootstrap.min.css"> {% endcomment %}

        <!-- Bootstrap Icons (optional) -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Placed at the end of the document so the pages load faster -->
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>

        <!-- jQuery UI CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/themes/smoothness/jquery-ui.min.css">
        <!-- jQuery UI JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>

        <!-- DataTables Bootstrap 5 integration -->
        <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

        <!-- DataTables JS -->
        <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>


        <!-- FullCalendar CSS -->
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
        <!-- Custom Styles -->
        <link rel="stylesheet" href="{% static 'style-v2.css' %}?v=20260529-tournaments-mobile-tighten-11" />
        <!-- FullCalendar JS -->
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
 

        <!-- DataTable data fixes -->
        <script>
            $(document).ready(function () {
                var fuzzyNum = function(x) {
                    return x.replace(/[^\d\.\-]/g,"");
                };

                jQuery.fn.dataTable.ext.order['numbercase-asc'] = function(x, y){
                    return fuzzyNum(x)- fuzzyNum(y);
                };

                jQuery.fn.dataTable.ext.order['numbercase-desc'] = function(x, y){
                    return fuzzyNum(y)- fuzzyNum(x);
                };

                jQuery('.force-follow-link').click(function(e) {
                    e.preventDefault();
                    window.location.href = jQuery(this).attr('href');
                });
            });
        </script>
    </head>
    <body class="d-flex flex-column min-vh-100" style="min-height: 100vh; display: flex; flex-direction: column;">
