{% if messages %}
    {% for message in messages %}
    <div class="alert-dismissible alert alert-{% if message.tags %}{{ message.tags }}{% endif %}">
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
        {{ message|safe }}
    </div>
    {% endfor %}
{% endif %}
