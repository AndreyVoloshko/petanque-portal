# the upstream component nginx needs to connect to
upstream django {
    server petanque_portal_web_api:8000; # stream using http server due to app is running in separate container
}

# configuration of the server
server {

    # the port your site will be served on, default_server indicates that this server block
    # is the block to use if no blocks match the server_name
    listen      8080 default_server;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        autoindex on;
    }

    # the domain name it will serve for
    # server_name .example.com; # substitute your machine's IP address or FQDN
    charset     utf-8;

    # max upload size
    client_max_body_size 1024M;   # adjust to taste

    # Static
    location /static/ {
        alias /application/static/;
        gzip_static on;
        expires max;
        add_header Cache-Control public;
    }

    # Static
    location /media/images/ {
        alias /application/media/images/;
        gzip_static on;
        expires max;
        add_header Cache-Control public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Fider feedback board — feedback.petanque.org.ua
server {
    listen      8080;
    server_name feedback.petanque.org.ua;
    charset     utf-8;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name feedback.petanque.org.ua;
    charset     utf-8;

    client_max_body_size 20M;

    # Shared certificate with portal.petanque.org.ua (issued with both domains as SANs,
    # see deploy/init-letsencrypt.sh)
    ssl_certificate /etc/letsencrypt/live/portal.petanque.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.petanque.org.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        # Resolve at request time via Docker DNS so nginx starts even when
        # the fider container is not running (e.g. local dev without the
        # "feedback" compose profile).
        resolver 127.0.0.11 valid=30s;
        set $fider_upstream http://petanque_feedback_fider:3000;
        proxy_pass $fider_upstream;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
    }
}

server {
    # default_server is required: this block has no server_name, so it must be
    # the explicit default to keep catching portal traffic now that the
    # feedback.petanque.org.ua vhost above also listens on 443.
    listen 443 ssl default_server;

    # max upload size
    client_max_body_size 1024M;   # adjust to taste
    charset     utf-8;

    #server_name portal.petanque.org.ua;

    ssl_certificate /etc/letsencrypt/live/portal.petanque.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.petanque.org.ua/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static
    location /static/ {
        alias /application/static/;
        gzip_static on;
        expires max;
        add_header Cache-Control public;
    }

    # Static
    location /media/images/ {
        alias /application/media/images/;
        gzip_static on;
        expires max;
        add_header Cache-Control public;
    }

    location / {
        proxy_pass http://django;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
    }
}
