services:
  petanque_portal_web_api:
    build:
      context: ./components/web-api/
      dockerfile: Dockerfile.service
    ports:
     - "60102:8000"
    env_file:
      - .env
    volumes:
     - petanque_uploaded_files:/application/media/images/
    depends_on:
     - petanque_portal_db

  petanque_portal_nginx:
    build:
      context: ./components/web-api/
      dockerfile: Dockerfile.nginx
    user: "0:0"
    ports:
     - "60102:8080"
    volumes:
     - petanque_uploaded_files:/application/media/images/
     - ./data/certbot/conf:/etc/letsencrypt
     - ./data/certbot/www:/var/www/certbot
    depends_on:
     - petanque_portal_web_api
     - certbot

  petanque_portal_db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: petanque_portal_db_password
      POSTGRES_USER: postgres
      POSTGRES_DB: petanque_portal
    volumes:
     - petanque_db:/var/lib/postgresql/data

  petanque_portal_adminer:
    image: adminer
    restart: always
    ports:
      - 60103:8080

  certbot:
    image: certbot/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot


volumes:
  petanque_db:
  petanque_uploaded_files: