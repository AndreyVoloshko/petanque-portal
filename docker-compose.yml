services:
  petanque_portal_web_api:
    build:
      context: ./components/web-api/
      dockerfile: Dockerfile.service
    ports:
     - "60102:8000"
    env_file:
      - .env
    volumes:
     - petanque_uploaded_files:/application/media/images/
    depends_on:
     - petanque_portal_db

  petanque_portal_nginx:
    build:
      context: ./components/web-api/
      dockerfile: Dockerfile.nginx
    ports:
     - "80:8080"
     - "443:443"
    volumes:
     - petanque_uploaded_files:/application/media/images/
     - ./data/certbot/conf:/etc/letsencrypt
     - ./data/certbot/www:/var/www/certbot
    depends_on:
     - petanque_portal_web_api

  petanque_portal_db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-petanque_portal}
    volumes:
     - petanque_db:/var/lib/postgresql/data

  petanque_portal_adminer:
    image: adminer
    restart: always
    ports:
      - 60103:8080

  petanque_feedback_fider:
    build:
      context: https://github.com/AndreyVoloshko/fider.git#main
    profiles: ["feedback"]
    restart: always
    environment:
      BASE_URL: ${FIDER_BASE_URL:-https://feedback.petanque.org.ua}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@petanque_portal_db:5432/fider?sslmode=disable
      JWT_SECRET: ${FIDER_JWT_SECRET}
      LOCALE: uk
      EMAIL: smtp
      EMAIL_NOREPLY: ${FIDER_EMAIL_NOREPLY:-noreply@petanque.org.ua}
      EMAIL_SMTP_HOST: ${FIDER_SMTP_HOST}
      EMAIL_SMTP_PORT: ${FIDER_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${FIDER_SMTP_USERNAME}
      EMAIL_SMTP_PASSWORD: ${FIDER_SMTP_PASSWORD}
    depends_on:
      - petanque_portal_db

  certbot:
    image: certbot/certbot
    depends_on:
      - petanque_portal_nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot


volumes:
  petanque_db:
  petanque_uploaded_files: